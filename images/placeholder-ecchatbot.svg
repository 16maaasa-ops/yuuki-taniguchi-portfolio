<svg xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#FFF"/><text x="40" y="66" fill="#1A1A1A" font-size="20" font-weight="bold">① FAQに載っていることは、根拠つきで即答</text><rect width="540" height="580" x="40" y="86" fill="#F2F4F1" rx="16"/><rect width="540" height="52" x="40" y="86" fill="#4C7A3F" rx="16"/><text x="64" y="119" fill="#FFF" font-size="17" font-weight="bold">🌿 BOTANICA サポート</text><rect width="256" height="52" x="300" y="164" fill="#4C7A3F" rx="14"/><text x="324" y="196" fill="#FFF" font-size="15">送料はいくらですか?</text><rect width="420" height="118" x="64" y="240" fill="#FFF" stroke="#E1E5DE" rx="14"/><text x="88" y="274" fill="#1A1A1A" font-size="15">送料は全国一律550円でございます。</text><text x="88" y="300" fill="#1A1A1A" font-size="15">5,000円(税込)以上のご購入で送料無料です。</text><rect width="150" height="26" x="88" y="318" fill="#E5ECE0" rx="13"/><text x="104" y="336" fill="#5C6B4F" font-size="13">FAQ No.4 を参照</text><rect width="256" height="52" x="300" y="382" fill="#4C7A3F" rx="14"/><text x="324" y="414" fill="#FFF" font-size="15">対応が遅すぎる。責任者を出して</text><rect width="420" height="118" x="64" y="458" fill="#FFF" stroke="#E1E5DE" rx="14"/><text x="88" y="492" fill="#1A1A1A" font-size="15">ご不便をおかけし申し訳ございません。</text><text x="88" y="518" fill="#1A1A1A" font-size="15">担当者より改めてご連絡いたします。</text><rect width="180" height="26" x="88" y="536" fill="#F3E3C8" rx="13"/><text x="104" y="554" fill="#8A5A1F" font-size="13">AIが自動で担当者へ引き継ぎ</text><text x="620" y="66" fill="#1A1A1A" font-size="20" font-weight="bold">② 判断が必要なものは、担当者の画面へ</text><rect width="540" height="580" x="620" y="86" fill="#EBEEF3" rx="6"/><text x="648" y="126" fill="#1A1A1A" font-size="16" font-weight="bold">BOTANICA サポート管理画面</text><rect width="150" height="34" x="648" y="146" fill="#547042" rx="4"/><text x="723" y="169" fill="#FFF" font-size="13" text-anchor="middle">対応待ち (2)</text><rect width="484" height="70" x="648" y="194" fill="#FFF" rx="4"/><text x="672" y="222" fill="#8A8578" font-size="14">田中さん</text><text x="672" y="248" fill="#1A1A1A" font-size="15">対応が遅すぎる。責任者を出してください</text><rect width="484" height="70" x="648" y="276" fill="#FFF" rx="4"/><text x="672" y="304" fill="#8A8578" font-size="14">佐藤さん</text><text x="672" y="330" fill="#1A1A1A" font-size="15">請求が二重になっているようです</text><rect width="484" height="230" x="648" y="372" fill="#FFF" rx="4"/><rect width="112" height="36" x="1000" y="392" fill="#547042" rx="6"/><text x="1056" y="416" fill="#FFF" font-size="14" text-anchor="middle">対応する</text><text x="672" y="416" fill="#8A5A1F" font-size="14">🟡 対応待ち</text><rect width="440" height="70" x="672" y="444" fill="#F2ede1" rx="6"/><text x="692" y="474" fill="#1A1A1A" font-size="14">ご不便をおかけしており、大変申し訳ございま</text><text x="692" y="498" fill="#1A1A1A" font-size="14">せん。担当者より改めてご連絡いたします。</text><text x="890" y="700" fill="#8A8578" font-size="20" text-anchor="middle">※ 実際の画面スクリーンショットに差し替え予定(データはダミー)</text></svg>