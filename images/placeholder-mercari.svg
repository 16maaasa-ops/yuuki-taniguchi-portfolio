<svg xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#FFF"/><rect width="1200" height="64" fill="#1E3A5F"/><text x="36" y="41" fill="#F7F8FA" font-size="24" font-weight="bold">メルカリ出品アシスタント</text><rect width="540" height="400" x="36" y="100" fill="#EBEEF3" rx="4"/><text x="306" y="290" fill="#8A8578" font-size="22" text-anchor="middle">商品写真</text><text x="306" y="330" fill="#8A8578" font-size="18" text-anchor="middle">(ここに撮影した写真)</text><rect width="552" height="180" x="612" y="100" fill="#EBEEF3" rx="4"/><text x="636" y="140" fill="#1E3A5F" font-size="16" font-weight="bold">生成された商品名</text><text x="636" y="180" fill="#1A1A1A" font-size="20">美品 ウールコート ロング丈 グレー</text><text x="636" y="212" fill="#1A1A1A" font-size="20">Mサイズ 秋冬</text><text x="1100" y="256" fill="#4A4A46" font-size="14" text-anchor="end">38 / 40文字</text><rect width="552" height="196" x="612" y="304" fill="#EBEEF3" rx="4"/><text x="636" y="344" fill="#1E3A5F" font-size="16" font-weight="bold">生成された説明文</text><text x="636" y="382" fill="#4A4A46" font-size="17">ご覧いただきありがとうございます。</text><text x="636" y="414" fill="#4A4A46" font-size="17">数回着用のみの美品です。着丈98cm・身幅50cm。</text><text x="636" y="446" fill="#4A4A46" font-size="17">柔らかいウール素材で軽く、通勤にも◎…</text><rect width="240" height="56" x="36" y="540" fill="#1E3A5F" rx="3"/><text x="156" y="576" fill="#FFF" font-size="18" font-weight="bold" text-anchor="middle">生成する</text><rect width="240" height="56" x="292" y="540" fill="#FFF" stroke="#1E3A5F" stroke-width="2" rx="3"/><text x="412" y="576" fill="#1E3A5F" font-size="18" font-weight="bold" text-anchor="middle">コピー</text><text x="600" y="700" fill="#8A8578" font-size="20" text-anchor="middle">※ 実際の画面スクリーンショット/操作動画に差し替え予定(データはダミー)</text></svg>