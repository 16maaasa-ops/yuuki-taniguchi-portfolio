<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="sans-serif">
  <rect width="1200" height="750" fill="#FFFFFF"/>
  <rect x="36" y="40" width="420" height="670" rx="24" fill="#8FA3B8" opacity="0.25"/>
  <rect x="66" y="90" width="260" height="64" rx="16" fill="#FFFFFF" stroke="#D9DEE5"/>
  <text x="90" y="130" font-size="17" fill="#1A1A1A">予約はできますか?</text>
  <rect x="140" y="180" width="290" height="120" rx="16" fill="#1E3A5F"/>
  <text x="164" y="222" font-size="16" fill="#FFFFFF">はい、前日までLINEで承ります。</text>
  <text x="164" y="252" font-size="16" fill="#FFFFFF">ご希望の日時をお送りください。</text>
  <text x="164" y="282" font-size="16" fill="#FFFFFF">(営業時間 10:00〜19:00)</text>
  <rect x="66" y="330" width="260" height="64" rx="16" fill="#FFFFFF" stroke="#D9DEE5"/>
  <text x="90" y="370" font-size="17" fill="#1A1A1A">駐車場はありますか?</text>
  <rect x="140" y="420" width="290" height="90" rx="16" fill="#1E3A5F"/>
  <text x="164" y="462" font-size="16" fill="#FFFFFF">店舗裏に2台ございます。</text>
  <text x="164" y="492" font-size="16" fill="#FFFFFF">満車の際は近隣コインPへ。</text>
  <rect x="520" y="40" width="644" height="670" rx="4" fill="#EBEEF3"/>
  <text x="548" y="92" font-size="22" fill="#1A1A1A" font-weight="bold">オーナー向け管理画面</text>
  <rect x="548" y="120" width="588" height="70" rx="3" fill="#FFFFFF"/>
  <text x="572" y="150" font-size="15" fill="#1E3A5F" font-weight="bold">Q. 営業時間</text>
  <text x="572" y="176" font-size="15" fill="#4A4A46">10:00〜19:00(火曜定休) [編集]</text>
  <rect x="548" y="206" width="588" height="70" rx="3" fill="#FFFFFF"/>
  <text x="572" y="236" font-size="15" fill="#1E3A5F" font-weight="bold">Q. 予約方法</text>
  <text x="572" y="262" font-size="15" fill="#4A4A46">LINEで前日まで受付 [編集]</text>
  <rect x="548" y="292" width="588" height="70" rx="3" fill="#FFFFFF"/>
  <text x="572" y="322" font-size="15" fill="#1E3A5F" font-weight="bold">Q. 駐車場</text>
  <text x="572" y="348" font-size="15" fill="#4A4A46">店舗裏2台 [編集]</text>
  <text x="600" y="700" font-size="20" fill="#8A8578" text-anchor="middle">※ 実際の画面スクリーンショットに差し替え予定(データはダミー)</text>
</svg>
