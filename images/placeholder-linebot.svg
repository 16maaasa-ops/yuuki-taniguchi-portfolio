<svg xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" viewBox="0 0 1200 750"><rect width="1200" height="750" fill="#FFF"/><rect width="420" height="670" x="36" y="40" fill="#8FA3B8" opacity=".25" rx="24"/><rect width="260" height="64" x="66" y="90" fill="#FFF" stroke="#D9DEE5" rx="16"/><text x="90" y="130" fill="#1A1A1A" font-size="17">予約はできますか?</text><rect width="290" height="120" x="140" y="180" fill="#1E3A5F" rx="16"/><text x="164" y="222" fill="#FFF" font-size="16">はい、前日までLINEで承ります。</text><text x="164" y="252" fill="#FFF" font-size="16">ご希望の日時をお送りください。</text><text x="164" y="282" fill="#FFF" font-size="16">(営業時間 10:00〜19:00)</text><rect width="260" height="64" x="66" y="330" fill="#FFF" stroke="#D9DEE5" rx="16"/><text x="90" y="370" fill="#1A1A1A" font-size="17">駐車場はありますか?</text><rect width="290" height="90" x="140" y="420" fill="#1E3A5F" rx="16"/><text x="164" y="462" fill="#FFF" font-size="16">店舗裏に2台ございます。</text><text x="164" y="492" fill="#FFF" font-size="16">満車の際は近隣コインPへ。</text><rect width="644" height="670" x="520" y="40" fill="#EBEEF3" rx="4"/><text x="548" y="92" fill="#1A1A1A" font-size="22" font-weight="bold">オーナー向け管理画面</text><rect width="588" height="70" x="548" y="120" fill="#FFF" rx="3"/><text x="572" y="150" fill="#1E3A5F" font-size="15" font-weight="bold">Q. 営業時間</text><text x="572" y="176" fill="#4A4A46" font-size="15">10:00〜19:00(火曜定休) [編集]</text><rect width="588" height="70" x="548" y="206" fill="#FFF" rx="3"/><text x="572" y="236" fill="#1E3A5F" font-size="15" font-weight="bold">Q. 予約方法</text><text x="572" y="262" fill="#4A4A46" font-size="15">LINEで前日まで受付 [編集]</text><rect width="588" height="70" x="548" y="292" fill="#FFF" rx="3"/><text x="572" y="322" fill="#1E3A5F" font-size="15" font-weight="bold">Q. 駐車場</text><text x="572" y="348" fill="#4A4A46" font-size="15">店舗裏2台 [編集]</text><text x="600" y="700" fill="#8A8578" font-size="20" text-anchor="middle">※ 実際の画面スクリーンショットに差し替え予定(データはダミー)</text></svg>